teleop_twist_joy_node:
  ros__parameters:
    axis_linear.x: 1
    scale_linear.x: 0.3
    scale_linear_turbo.x: 0.5

    axis_angular.yaw: 3
    scale_angular.yaw: 1.0

    enable_button: 5          
    require_enable_button: true

    publish_stamped_twist: true   
    # needed since diff_drive_controller expects TwistStamped