controller_manager:
  ros__parameters:
    update_rate: 30  # Hz — match loop_rate_hz in the xacro above

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["wheel_right_joint"]   # swapped to fix reversed turns
    right_wheel_names: ["wheel_left_joint"]   # swapped to fix reversed turns

    wheel_separation: 0.17
    wheel_radius: 0.033

    publish_rate: 30.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]

    open_loop: false
    enable_odom_tf: true

    cmd_vel_timeout: 0.5

    # new: speed and acceleration limits
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.05
        min_velocity: -0.05
        has_acceleration_limits: true
        max_acceleration: 0.4
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 1.5